name: Tests
on:
  push:
    branches:
    - dev
    - release
  pull_request:
  workflow_dispatch:

# cancel in-progress runs for the same branch/PR when new commits are pushed
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # checkout this repo
      - name: Checkout
        uses: actions/checkout@v4
      # install Node
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # install dependencies
      - name: Install dependencies
        run: npm ci
      # run tests (Linux runners have no display, so use a virtual one)
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test
      # upload traces (can be inspected with `npx playwright show-trace`)
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
